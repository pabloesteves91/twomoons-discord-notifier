<!-- Vorlage für assets/bot-avatar.png — gleiche Geometrie, hier bearbeitbar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="himmel" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1e2a46"/>
      <stop offset="100%" stop-color="#0c101c"/>
    </radialGradient>
    <mask id="grosse-sichel">
      <circle cx="300" cy="200" r="120" fill="#fff"/>
      <circle cx="252" cy="166" r="116" fill="#000"/>
    </mask>
    <mask id="kleine-sichel">
      <circle cx="176" cy="338" r="64" fill="#fff"/>
      <circle cx="150" cy="318" r="60" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#himmel)"/>

  <circle cx="300" cy="200" r="120" fill="#f4e5c6" mask="url(#grosse-sichel)"/>
  <circle cx="176" cy="338" r="64" fill="#f4e5c6" opacity="0.8" mask="url(#kleine-sichel)"/>

  <g fill="#ffffff" opacity="0.59">
    <circle cx="96" cy="132" r="7"/>
    <circle cx="150" cy="96" r="4"/>
    <circle cx="402" cy="386" r="5"/>
    <circle cx="360" cy="440" r="3"/>
    <circle cx="84" cy="236" r="3"/>
  </g>
</svg>
