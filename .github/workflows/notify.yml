name: TwoMoons Event Notifier

on:
  schedule:
    # GitHub-Cron kennt keine Sommerzeit. Beide Zeitpunkte entsprechen 09:00 in
    # der Schweiz — je nach Jahreszeit einer davon; der andere bricht unten ab.
    - cron: "0 7 * * *" # 09:00 Sommerzeit (CEST)
    - cron: "0 8 * * *" # 09:00 Winterzeit (CET)
  # Diagnose ohne Knopfdruck: eine Änderung an debug-run.txt startet einen Lauf,
  # der zwingend im Dry-Run läuft — er kann nichts posten und nichts speichern.
  push:
    paths:
      - "debug-run.txt"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur loggen, nichts posten und state.json nicht ändern"
        type: boolean
        default: false
      post_existing:
        description: "Beim ersten Lauf alle aktuellen Events posten (statt nur zu merken)"
        type: boolean
        default: false
      categories:
        description: "Optional: einzelne Kategorien, mit Komma getrennt (z. B. magic,pokemon)"
        type: string
        default: ""
      reset:
        description: "Gemerkte Events vergessen — zusammen mit post_existing für den Kanalwechsel"
        type: boolean
        default: false
      limit:
        description: "Optional: maximale Anzahl Posts pro Kategorie (0 = Wert aus config.json)"
        type: string
        default: "0"
      debug:
        description: "Ausführliches Log (zeigt u. a. die im Modal gefundenen Zeilen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: twomoons-notifier
  cancel-in-progress: false

jobs:
  # Ziel: genau ein Lauf pro Tag, frühestens ab 09:00 Schweizer Zeit. GitHub hält
  # geplante Läufe bei Last oft stundenlang auf, deshalb entscheidet nicht die
  # Uhrzeit, sondern ob heute schon gearbeitet wurde — sonst fällt der Lauf aus.
  zeitfenster:
    runs-on: ubuntu-latest
    outputs:
      los: ${{ steps.pruefen.outputs.los }}
    steps:
      - uses: actions/checkout@v4

      - id: pruefen
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manueller Lauf — wird ausgeführt."
            echo "los=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stunde="$(TZ=Europe/Zurich date +%H)"
          heute="$(TZ=Europe/Zurich date +%F)"
          letzter="$(python3 - <<'PY'
          import datetime, json, pathlib, zoneinfo

          state = pathlib.Path("state.json")
          stamps = []
          if state.exists():
              kategorien = json.loads(state.read_text(encoding="utf-8")).get("categories", {})
              stamps = [c["last_run"] for c in kategorien.values() if c.get("last_run")]

          if stamps:
              gemeldet = datetime.datetime.strptime(max(stamps), "%Y-%m-%dT%H:%M:%SZ")
              gemeldet = gemeldet.replace(tzinfo=datetime.timezone.utc)
              print(gemeldet.astimezone(zoneinfo.ZoneInfo("Europe/Zurich")).date().isoformat())
          PY
          )"

          echo "Schweizer Zeit: ${heute} ${stunde} Uhr — letzter Lauf: ${letzter:-noch keiner}"
          if [ "$stunde" -lt 9 ]; then
            echo "Vor 09:00 — dieser Lauf wird übersprungen."
            echo "los=false" >> "$GITHUB_OUTPUT"
          elif [ "$letzter" = "$heute" ]; then
            echo "Heute wurde bereits gearbeitet — dieser Lauf wird übersprungen."
            echo "los=false" >> "$GITHUB_OUTPUT"
          else
            echo "los=true" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: zeitfenster
    if: needs.zeitfenster.outputs.los == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # "Re-run jobs" wiederholt den ursprünglichen Commit: alter Code und ein
      # state.json-Stand von damals, wodurch bereits gepostete Events erneut als
      # neu gelten. Abbrechen, bevor Duplikate im Kanal landen.
      - name: Re-runs abweisen
        if: ${{ github.run_attempt != 1 }}
        run: |
          echo "::error::Dieser Lauf ist ein Re-run des Commits ${GITHUB_SHA} und würde alten Code mit altem Stand ausführen. Bitte stattdessen über 'Run workflow' neu starten."
          exit 1

      # Jeder Lauf committet state.json. Wurde kurz zuvor einer ausgeführt, hat der
      # Checkout einen älteren Stand — ohne Abgleich würden dessen Events erneut
      # gepostet. Deshalb hier den aktuellen Stand nachziehen statt abzubrechen.
      - name: Aktuellen state.json-Stand holen
        run: |
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if git checkout "origin/$GITHUB_REF_NAME" -- state.json 2>/dev/null; then
            echo "state.json vom Branch übernommen"
          else
            echo "Noch keine state.json im Repo — erster Lauf"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Notifier ausführen
        env:
          DISCORD_WEBHOOK_MAGIC: ${{ secrets.DISCORD_WEBHOOK_MAGIC }}
          DISCORD_WEBHOOK_POKEMON: ${{ secrets.DISCORD_WEBHOOK_POKEMON }}
          DISCORD_WEBHOOK_STAR_WARS: ${{ secrets.DISCORD_WEBHOOK_STAR_WARS }}
          DISCORD_WEBHOOK_YUGIOH: ${{ secrets.DISCORD_WEBHOOK_YUGIOH }}
          DISCORD_WEBHOOK_LORCANA: ${{ secrets.DISCORD_WEBHOOK_LORCANA }}
          DISCORD_WEBHOOK_ONE_PIECE: ${{ secrets.DISCORD_WEBHOOK_ONE_PIECE }}
          DISCORD_WEBHOOK_FLESH_BLOOD: ${{ secrets.DISCORD_WEBHOOK_FLESH_BLOOD }}
          DISCORD_WEBHOOK_RIFTBOUND: ${{ secrets.DISCORD_WEBHOOK_RIFTBOUND }}
          DISCORD_WEBHOOK_UNTERHALTUNG: ${{ secrets.DISCORD_WEBHOOK_UNTERHALTUNG }}
          DRY_RUN: ${{ inputs.dry_run }}
          POST_EXISTING: ${{ inputs.post_existing }}
          CATEGORIES: ${{ inputs.categories }}
          LIMIT: ${{ inputs.limit }}
          DEBUG: ${{ inputs.debug }}
          RESET: ${{ inputs.reset }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "push" ]; then
            # Von debug-run.txt ausgelöst: alle Kategorien analysieren, niemals posten.
            python notifier.py --dry-run --verbose --include-inactive
            exit $?
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$RESET" = "true" ]; then
            args+=(--reset)
          fi
          if [ "$DEBUG" = "true" ]; then
            args+=(--verbose)
          fi
          if [ "$POST_EXISTING" = "true" ]; then
            args+=(--post-existing)
          fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            args+=(--limit "$LIMIT")
          fi
          if [ -n "$CATEGORIES" ]; then
            IFS=',' read -ra keys <<< "$CATEGORIES"
            for key in "${keys[@]}"; do
              trimmed="$(echo "$key" | xargs)"
              if [ -n "$trimmed" ]; then
                args+=(--category "$trimmed")
              fi
            done
          fi
          python notifier.py ${args[@]+"${args[@]}"}

      # always(): auch wenn eine Kategorie gescheitert ist, muss der Stand der
      # erfolgreichen Kategorien gesichert werden — sonst wird alles erneut gepostet.
      - name: state.json zurück ins Repo committen
        if: ${{ always() && github.event_name != 'push' && inputs.dry_run != true }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: state.json aktualisiert [skip ci]"
          file_pattern: state.json
